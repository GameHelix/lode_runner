name: deploy
on:
  workflow_dispatch:
    inputs:
      service:
        description: The service to deploy
        required: true
        type: choice
        options: [trader, notifier, app]
      rollback:
        description: Run the image before the current one instead of this commit
        type: boolean
        default: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: SSH to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - env:
          SERVICE: ${{ inputs.service }}
          ROLLBACK: ${{ inputs.rollback && '--rollback' || '' }}
          HOST: deploy@${{ vars.SERVER_IP }}
        run: ./deploy.sh "$SERVICE" $ROLLBACK "$HOST"
