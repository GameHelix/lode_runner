name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.changes.outputs.go }}
      infra: ${{ steps.changes.outputs.infra }}
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then files=$(git diff --name-only "$BASE" HEAD); else files=$(git ls-files); fi
          files=$(grep -v '\.md$' <<<"$files" || true)
          has() { grep -qE "$1" <<<"$files"; }
          has '^(trader|notifier|app)/|^go\.(mod|sum)$|^\.github/' && echo go=true >>"$GITHUB_OUTPUT"
          has '^infra/|^deploy\.sh$|^\.github/' && echo infra=true >>"$GITHUB_OUTPUT"
          # A service ships when anything of it changed since the commit it
          # runs, as /healthz reports, so a failed run or a rollback leaves
          # nothing behind; without that answer, when the push changed it.
          health=$(curl -fsS --max-time 10 https://candy.surf/healthz || true)
          deploy=""
          for spec in 'trader:engine:^trader/|^go\.(mod|sum)$' 'notifier:notifier:^notifier/|^go\.(mod|sum)$' 'app:app:^app/|^trader/api/|^go\.(mod|sum)$'; do
            IFS=: read -r svc key pattern <<<"$spec"
            running=$(jq -r --arg k "$key" '.commits[$k] // empty' <<<"$health" 2>/dev/null || true)
            changed=$files
            if [ -n "$running" ] && git cat-file -e "$running^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$running" HEAD | grep -v '\.md$' || true)
            fi
            grep -qE "$pattern" <<<"$changed" && deploy="$deploy $svc"
          done
          echo "deploy=${deploy# }" >>"$GITHUB_OUTPUT"
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -shuffle=on -timeout 5m ./...
  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - run: tofu fmt -check -recursive
      - run: tofu -chdir=existing init -backend=false -input=false && tofu -chdir=existing validate
      - run: tofu -chdir=hetzner init -backend=false -input=false && tofu -chdir=hetzner validate
      - run: tofu -chdir=modules/host init -input=false && tofu -chdir=modules/host test
      - name: shellcheck the scripts and the rendered bootstrap
        run: |
          shellcheck -S warning -e SC2087 ../deploy.sh env.sh hetzner/tofu.sh hetzner/rebuild.sh actions-key.sh backup/*.sh
          cd modules/host/tests/render
          tofu init -input=false
          tofu apply -auto-approve -input=false
          tofu output -raw user_data | shellcheck -s bash -
  # Each push to main ships the services it changed, engine first, once the
  # tests pass. It waits until the repository has its deploy key (see
  # infra/actions-key.sh), which sets SERVER_IP last.
  deploy:
    needs: [changes, go]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SERVER_IP != '' &&
      needs.changes.outputs.deploy != '' && (needs.go.result == 'success' || needs.go.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: SSH to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - env:
          SERVICES: ${{ needs.changes.outputs.deploy }}
          HOST: deploy@${{ vars.SERVER_IP }}
        run: for s in $SERVICES; do ./deploy.sh "$s" "$HOST"; done
      - name: The services report this commit
        env:
          SERVICES: ${{ needs.changes.outputs.deploy }}
        run: |
          health=$(curl -fsS --retry 6 --retry-delay 5 https://candy.surf/healthz)
          for s in $SERVICES; do
            key=$s
            [ "$s" = trader ] && key=engine
            jq -e --arg k "$key" --arg c "${GITHUB_SHA::12}" '.commits[$k] == $c' <<<"$health" >/dev/null || { echo "$s does not run ${GITHUB_SHA::12}: $health"; exit 1; }
          done
