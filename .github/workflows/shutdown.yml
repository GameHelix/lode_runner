name: shutdown
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: plan lists what the Hetzner project holds and what would go; shutdown stops Candylario for good
        required: true
        type: choice
        options: [plan, shutdown]
jobs:
  shutdown:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - name: SSH to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - env:
          HOST: deploy@${{ vars.SERVER_IP }}
          # The token is a secret here: the server that also holds it is destroyed.
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          MODE: ${{ inputs.confirm == 'plan' && '--plan' || '' }}
        run: ./infra/hetzner/shutdown.sh "$HOST" $MODE
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tofu-state
          path: infra/hetzner/terraform.tfstate
          retention-days: 3
          if-no-files-found: ignore
