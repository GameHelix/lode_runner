name: backup
on:
  workflow_dispatch:
    inputs:
      action:
        description: install sets up the nightly backup and backs up once; check restores the latest night of each database into a scratch database
        required: true
        type: choice
        options: [install, check]
jobs:
  backup:
    runs-on: ubuntu-latest
    concurrency:
      group: backup
    steps:
      - uses: actions/checkout@v4
      - name: SSH to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - if: inputs.action == 'check'
        run: sudo apt-get -qq update && sudo apt-get -yqq install age >/dev/null
      - env:
          ACTION: ${{ inputs.action }}
          HOST: deploy@${{ vars.SERVER_IP }}
        run: |
          if [ "$ACTION" = install ]; then
            ./infra/backup/install.sh "$HOST" --now
          else
            day=$(./infra/backup/restore.sh "$HOST" | tail -1)
            for s in trader notifier app; do ./infra/backup/restore.sh "$HOST" "$day" "$s"; done
          fi
