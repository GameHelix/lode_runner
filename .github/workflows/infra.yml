name: infra
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the changes; without it, only plan
        type: boolean
        default: false
jobs:
  tofu:
    runs-on: ubuntu-latest
    concurrency:
      group: infra
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - name: SSH to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - env:
          HOST: deploy@${{ vars.SERVER_IP }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = true ]; then
            ./infra/hetzner/tofu.sh "$HOST" apply -input=false -auto-approve -no-color
          else
            ./infra/hetzner/tofu.sh "$HOST" plan -input=false -no-color
          fi
